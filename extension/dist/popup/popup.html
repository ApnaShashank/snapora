<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>FullPagePrint</title></head><body>
  <div class=popup>
    
    <header class=popup-header>
      <div class=logo>
        <svg width=18 height=18 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.2 stroke-linecap=round stroke-linejoin=round>
          <path d="M4 8V5a1 1 0 0 1 1-1h3"/>
          <path d="M16 4h3a1 1 0 0 1 1 1v3"/>
          <path d="M20 16v3a1 1 0 0 1-1 1h-3"/>
          <path d="M8 20H5a1 1 0 0 1-1-1v-3"/>
          <circle cx=12 cy=12 r=3 />
        </svg>
        <span>FullPagePrint</span>
      </div>
      <button id=btn-settings-toggle class=icon-btn title=Settings aria-label="Toggle settings">
        <svg width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx=12 cy=12 r=3 />
        </svg>
      </button>
    </header>

    
    <section class=section id=section-capture>
      <p class=section-label>Screenshot</p>

      <button id=btn-visible class=capture-btn data-mode=visible>
        <span class=capture-btn-icon>
          <svg width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>
            <rect x=2 y=3 width=20 height=14 rx=2 ry=2 />
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </span>
        <span class=capture-btn-text>
          <span class=capture-btn-title>Visible Screenshot</span>
          <span class=capture-btn-shortcut>Ctrl + Shift + S</span>
        </span>
      </button>

      <button id=btn-fullpage class=capture-btn data-mode=fullpage>
        <span class=capture-btn-icon>
          <svg width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>
            <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </span>
        <span class=capture-btn-text>
          <span class=capture-btn-title>Full Page</span>
          <span class=capture-btn-shortcut>Ctrl + Shift + F</span>
        </span>
      </button>

      <button id=btn-selection class=capture-btn data-mode=selection>
        <span class=capture-btn-icon>
          <svg width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>
            <path d="M3 3h4v4H3zM3 10h4v4H3zM10 3h4v4h-4zM17 3h4v4h-4zM3 17h4v4H3z"/>
            <path d="M10 10h11v11H10z" stroke-dasharray="3 2"/>
          </svg>
        </span>
        <span class=capture-btn-text>
          <span class=capture-btn-title>Select Area</span>
          <span class=capture-btn-shortcut>Ctrl + Shift + A</span>
        </span>
      </button>
    </section>

    
    <div class=divider></div>

    
    <section class=section id=section-shortcuts>
      <p class=section-label>Shortcuts</p>
      <div class=shortcut-list>
        <div class=shortcut-row>
          <span class=shortcut-name>Visible</span>
          <span class=shortcut-keys><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd></span>
        </div>
        <div class=shortcut-row>
          <span class=shortcut-name>Full Page</span>
          <span class=shortcut-keys><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>F</kbd></span>
        </div>
        <div class=shortcut-row>
          <span class=shortcut-name>Select Area</span>
          <span class=shortcut-keys><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>A</kbd></span>
        </div>
      </div>
      <p class=shortcut-note>
        To change shortcuts, visit
        <a href=# id=link-shortcuts class=text-link>chrome://extensions/shortcuts</a>
      </p>
    </section>

    
    <section class="section settings-panel" id=section-settings hidden>
      <p class=section-label>Settings</p>

      <div class=setting-row>
        <label class=setting-label for=toggle-auto-copy>Auto Copy</label>
        <input type=checkbox id=toggle-auto-copy class=toggle>
      </div>
      <div class=setting-row>
        <label class=setting-label for=toggle-auto-download>Auto Download</label>
        <input type=checkbox id=toggle-auto-download class=toggle>
      </div>
      <div class=setting-row>
        <label class=setting-label for=toggle-open-webapp>Open Web App</label>
        <input type=checkbox id=toggle-open-webapp class=toggle>
      </div>
      <div class=setting-row>
        <label class=setting-label for=toggle-hostname>Include Hostname</label>
        <input type=checkbox id=toggle-hostname class=toggle>
      </div>

      <div class=divider style="margin:10px 0"></div>

      <div class=setting-row>
        <label class=setting-label for=select-format>Format</label>
        <select id=select-format class=select>
          <option value=png>PNG</option>
          <option value=jpg>JPG</option>
        </select>
      </div>

      <div class=setting-row>
        <label class=setting-label for=input-webapp-url>Web App URL</label>
      </div>
      <input type=url id=input-webapp-url class=text-input placeholder=https://fullpageprint.vercel.app>

      <button id=btn-save-settings class=save-btn>Save Settings</button>
    </section>

    
    <div class=status-bar id=status-bar hidden>
      <span id=status-message></span>
    </div>
  </div>

  <script src=popup.js></script>


</body></html>
